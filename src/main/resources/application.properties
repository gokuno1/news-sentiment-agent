# Ollama (local Mistral)
ollama.baseUrl=http://localhost:11434
ollama.modelName=mistral
ollama.embeddingModelName=nomic-embed-text

# GDELT Doc 2.0 API
gdelt.baseUrl=https://api.gdeltproject.org/api/v2/doc/doc
gdelt.delaySeconds=10
gdelt.maxRecordsPerRequest=50
gdelt.timespan=5d

# Embedding store (local path for vector store persistence)
embedding.store.path=./data/embedding-store

# Agent loop
agent.maxIterations=5
agent.confidenceThreshold=0.9
rag.topK=25

# Execution mode: "pipeline" (deterministic loop, default) or "agentic" (LLM-driven tools)
agent.mode=agentic

# Optional: fetch full article content from GDELT URLs (default false - use snippets only)
gdelt.fetchFullContent=false

# Agentic mode: use vector store and RAG for better context (default false - set true to enable)
agentic.rag.enabled=true
