# ============================================================
# Anthropic Claude (reasoning LLM)
# ============================================================
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model-name=claude-sonnet-4-20250514
anthropic.temperature=0.2
anthropic.timeout-seconds=120

# ============================================================
# GDELT Doc 2.0 API
# ============================================================
gdelt.base-url=https://api.gdeltproject.org/api/v2/doc/doc
gdelt.delay-seconds=10
gdelt.max-records-per-request=50
gdelt.timespan=5d
gdelt.fetch-full-content=false

# ============================================================
# Tavily Search API
# ============================================================
tavily.api-key=${TAVILY_API_KEY:}
tavily.base-url=https://api.tavily.com
tavily.search-depth=advanced
tavily.max-results=10

# ============================================================
# FRED Economic Data API
# ============================================================
fred.api-key=${FRED_API_KEY:}
fred.base-url=https://api.stlouisfed.org/fred

# ============================================================
# Upstox Broker API v2
# ============================================================
upstox.api-key=${UPSTOX_API_KEY:}
upstox.api-secret=${UPSTOX_API_SECRET:}
upstox.redirect-uri=http://localhost:8080/api/upstox/callback
upstox.base-url=https://api.upstox.com/v2
upstox.access-token=${UPSTOX_ACCESS_TOKEN:}

# ============================================================
# Agent Configuration
# ============================================================
agent.safety-limit=50
agent.token-budget=25000
agent.coverage-check-interval=4
agent.max-nudges=3

# ============================================================
# Ollama (embedding model for RAG - optional)
# ============================================================
ollama.base-url=http://localhost:11434
ollama.embedding-model-name=nomic-embed-text

# ============================================================
# Embedding Store (RAG persistence)
# ============================================================
embedding.store.path=./data/embedding-store

# ============================================================
# Server
# ============================================================
server.port=8080
